<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entradas e saídas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <aside class="menu">
        <div class="marca"><span class="ponto"></span>Estoque+</div>
        <nav>
            <a href="index.html">Produtos</a>
            <a href="movimentacoes.html" class="ativo">Entradas / saídas</a>
            <a href="configuracoes.html">Configurações</a>
        </nav>
    </aside>

    <div class="pagina">

        <header class="cabecalho">
            <div>
                <h1>Entradas e saídas</h1>
                <p class="subtitulo">Registre o que entrou e o que saiu do estoque.</p>
            </div>
            <div class="acoes-topo">
                <button id="btn-entrada" class="botao-secundario">+ Nova entrada</button>
                <button id="btn-saida" class="botao-primario">+ Nova saída</button>
            </div>
        </header>

        <section class="resumo">
            <div class="cartao"><strong id="total-entradas">0</strong><span>Unidades que entraram</span></div>
            <div class="cartao"><strong id="total-saidas">0</strong><span>Unidades que saíram</span></div>
            <div class="cartao"><strong id="total-movimentacoes">0</strong><span>Movimentações</span></div>
        </section>

        <main class="conteudo">

            <section class="cartao cartao-tabela">
                <h2>Histórico</h2>
                <div class="filtros">
                    <label>De <input type="date" id="de"></label>
                    <label>Até <input type="date" id="ate"></label>
                    <label>Tipo
                        <select id="filtro-tipo">
                            <option value="">Todos</option>
                            <option value="entrada">Entradas</option>
                            <option value="saida">Saídas</option>
                        </select>
                    </label>
                    <button type="button" id="btn-filtrar" class="botao-primario">Filtrar</button>
                    <button type="button" id="btn-limpar" class="botao-cancelar">Limpar</button>
                </div>
                <table id="tabela-movimentacoes">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Tipo</th>
                            <th>Itens</th>
                            <th>Qtd</th>
                            <th>Valor</th>
                            <th>Observação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Movimentações vão aparecer aqui via JavaScript -->
                    </tbody>
                </table>
            </section>

        </main>

    </div>

    <dialog id="dialogo" class="cartao cartao-formulario">
        <h2 id="titulo-dialogo">Nova entrada</h2>
        <form id="form-movimentacao">
            <div id="lista-itens"></div>
            <button type="button" id="btn-add-item" class="botao-cancelar">+ Adicionar item</button>
            <p id="linha-total" class="total-dialogo">Total: <span id="total-dialogo">R$ 0,00</span></p>
            <div class="campo">
                <label for="observacao">Observação</label>
                <input type="text" id="observacao" placeholder="Ex: Cliente João / Compra do fornecedor">
            </div>
            <button type="submit" class="botao-primario">Registrar</button>
            <button type="button" id="btn-cancelar" class="botao-cancelar">Cancelar</button>
        </form>
    </dialog>

    <script src="comum.js"></script>
    <script src="movimentacoes.js"></script>
</body>
</html>
