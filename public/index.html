<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <aside class="menu">
        <div class="marca"><span class="ponto"></span>Estoque+</div>
        <nav>
            <a href="index.html" class="ativo">Produtos</a>
            <a href="movimentacoes.html">Entradas / saídas</a>
            <a href="configuracoes.html">Configurações</a>
        </nav>
    </aside>

    <div class="pagina">

        <header class="cabecalho">
            <div>
                <h1>Sistema de Estoque</h1>
                <p class="subtitulo">Cadastre, edite e acompanhe seus produtos em um só lugar.</p>
            </div>
            <button id="btn-novo" class="botao-primario">+ Novo produto</button>
        </header>

        <section class="resumo">
            <div class="cartao"><strong id="total-produtos">0</strong><span>Produtos</span></div>
            <div class="cartao"><strong id="total-baixo">0</strong><span>Estoque baixo</span></div>
            <div class="cartao"><strong id="valor-estoque">R$ 0,00</strong><span>Valor em estoque</span></div>
        </section>

        <main class="conteudo">

            <section class="cartao cartao-tabela">
                <h2>Produtos em estoque</h2>
                <input type="search" id="busca" class="busca" placeholder="Buscar por nome ou categoria">
                <table id="tabela-produtos">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Qtd</th>
                            <th>Mín</th>
                            <th>Preço</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Produtos vão aparecer aqui via JavaScript -->
                    </tbody>
                </table>
            </section>

        </main>

    </div>

    <dialog id="dialogo" class="cartao cartao-formulario">
        <h2 id="titulo-dialogo">Novo produto</h2>
        <form id="form-produto">
            <div class="campo">
                <label for="nome">Nome do produto</label>
                <input type="text" id="nome" placeholder="Ex: Caneta azul" required>
            </div>
            <div class="campo">
                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" placeholder="Ex: Peças">
            </div>
            <div class="campo">
                <label for="quantidade">Quantidade em estoque</label>
                <input type="number" id="quantidade" placeholder="0" min="0" required>
            </div>
            <div class="campo">
                <label for="minimo">Estoque mínimo</label>
                <input type="number" id="minimo" placeholder="0" min="0" required>
            </div>
            <div class="campo">
                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" placeholder="0,00" step="0.01" min="0" required>
            </div>
            <button type="submit" class="botao-primario">Salvar produto</button>
            <button type="button" id="btn-cancelar" class="botao-cancelar">Cancelar</button>
        </form>
    </dialog>

    <script src="comum.js"></script>
    <script src="script.js"></script>
</body>
</html>
