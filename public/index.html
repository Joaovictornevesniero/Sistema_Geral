<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header class="cabecalho">
        <h1>Sistema de Estoque</h1>
        <p class="subtitulo">Cadastre, edite e acompanhe seus produtos em um só lugar.</p>
    </header>

    <main class="conteudo">

        <section class="cartao cartao-formulario">
            <h2>Novo produto</h2>
            <form id="form-produto">
                <div class="campo">
                    <label for="nome">Nome do produto</label>
                    <input type="text" id="nome" placeholder="Ex: Caneta azul" required>
                </div>
                <div class="campo">
                    <label for="quantidade">Quantidade em estoque</label>
                    <input type="number" id="quantidade" placeholder="0" min="0" required>
                </div>
                <div class="campo">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" placeholder="0,00" step="0.01" min="0" required>
                </div>
                <button type="submit" class="botao-primario">Cadastrar produto</button>
            </form>
        </section>

        <section class="cartao cartao-tabela">
            <h2>Produtos em estoque</h2>
            <table id="tabela-produtos">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Produtos vão aparecer aqui via JavaScript -->
                </tbody>
            </table>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
